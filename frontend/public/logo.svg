<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340">
  <!-- النقطة الذهبية العلوية -->
  <circle cx="150" cy="28" r="16" fill="#E5A93C" />

  <!-- مسار خطوط الدلة الرئيسي بالتيراكوتا النجدية -->
  <g fill="none" stroke="#C86D51" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- غطاء الدلة والقمع العلوي -->
    <path d="M 142 64 C 142 54 158 54 158 64 C 158 82 178 98 198 108 L 102 108 C 122 98 142 82 142 64 Z" />
    
    <!-- خط فاصل الغطاء عن الجسم -->
    <line x1="102" y1="108" x2="198" y2="108" />

    <!-- مصب القهوة (الميزاب) متصل بالخصر والبدن -->
    <path d="M 102 108 C 82 106 32 102 18 116 C 54 126 90 148 106 178" />

    <!-- هيكل جسم الدلة الأساسي (الخصر والبدن والقاعدة) -->
    <path d="M 102 108 C 122 135 116 182 88 248 L 112 284 L 188 284 L 212 248 C 184 182 178 135 198 108" />

    <!-- المقبض الجانبي الملتف -->
    <path d="M 198 114 C 238 110 264 142 258 178 C 252 216 226 244 212 248" />

    <!-- الخط الأفقي البسيط داخل قاعدة الدلة -->
    <line x1="94" y1="248" x2="182" y2="248" />
  </g>
</svg>